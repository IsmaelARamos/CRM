spring:
  application:
    name: CRM

  # Configuração de Conexão com o PostgreSQL do Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_enterprise_db?createDatabaseIfNotExist=true
    username: crm_admin
    password: admin_password
    driver-class-name: org.postgresql.Driver

  # Configuração do Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Configuração do Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
